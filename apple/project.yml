name: MonteCarlo
options:
  bundleIdPrefix: com.nachosanbenito
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  MonteCarloKit:
    path: MonteCarloKit
targets:
  MonteCarlo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: MonteCarloKit
      # Sparkle 2.10.1 oficial (sparkle-project.org), descomprimido fuera del repo; actualizaciones del Mac
      - framework: ../../../apps-nativas/sparkle-2.10.1/Sparkle.framework
        embed: true
        destinationFilters: [macOS]
    # Sparkle (solo Mac): mira cada día si hay versión nueva y la instala sola al cerrar la app.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://nachosanbenito.com/monte-carlo-simulator/appcast.xml
        SUPublicEDKey: P4duSfYCtrpopwAjL9zcxrrLn7DYaDk3ws38jqC6Ehs=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_NAME: Monte Carlo Stock Simulator
        PRODUCT_BUNDLE_IDENTIFIER: com.nachosanbenito.montecarlo
        DEVELOPMENT_TEAM: 4HBV76K3X6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monte Carlo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ignacio San Benito"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
